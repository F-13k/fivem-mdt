<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>MDT Interface</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        nav { margin-bottom: 20px; }\n        .tab { display: inline-block; padding: 10px; margin-right: 10px; cursor: pointer; border: 1px solid #ccc; }\n        .active { background-color: #007BFF; color: white; }\n        .content { display: none; }\n        .content.active { display: block; }\n    </style>\n</head>\n<body>\n    <nav>\n        <div class="tab active" onclick="showTab('search')">Search</div>\n        <div class="tab" onclick="showTab('warrants')">Warrants</div>\n        <div class="tab" onclick="showTab('reports')">Reports</div>\n        <div class="tab" onclick="showTab('vehicles')">Vehicles</div>\n    </nav>\n    <div id="search" class="content active">\n        <h2>Search</h2>\n        <input type="text" placeholder="Search...">\n        <button>Search</button>\n    </div>\n    <div id="warrants" class="content">\n        <h2>Warrants</h2>\n        <p>No active warrants.</p>\n    </div>\n    <div id="reports" class="content">\n        <h2>Reports</h2>\n        <p>No reports available.</p>\n    </div>\n    <div id="vehicles" class="content">\n        <h2>Vehicles</h2>\n        <p>No vehicles listed.</p>\n    </div>\n    <script>\n        function showTab(tabName) {\n            // Hide all content divs\n            const contents = document.querySelectorAll('.content');\n            contents.forEach(content => content.classList.remove('active'));\n            // Remove active class from all tabs\n            const tabs = document.querySelectorAll('.tab');\n            tabs.forEach(tab => tab.classList.remove('active'));\n            // Show current tab and set as active\n            document.getElementById(tabName).classList.add('active');\n            document.querySelector(`.tab[onclick*="${tabName}"]`).classList.add('active');\n        }\n    </script>\n</body>\n</html>
